# Anotación azure.workload.identity/client-id:
# Sustituir REPLACE_ME_WORKLOAD_MI_CLIENT_ID por la salida de:
#   terraform output -raw workload_app_identity_client_id
# (desde landing-zone/infra/terraform), o úsala como parámetro del script deploy-phase8.ps1
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lz-app-sa
  namespace: default
  annotations:
    azure.workload.identity/client-id: "REPLACE_ME_WORKLOAD_MI_CLIENT_ID"
